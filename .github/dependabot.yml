version: 2
updates:
  - package-ecosystem: npm
    directory: /proxy
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pub
    directory: /syncinary
    schedule:
      interval: weekly
    groups:
      pub-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
